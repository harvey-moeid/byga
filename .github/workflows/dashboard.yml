name: Deploy Dashboard

# Build dashboard (Vite + React) lalu publish ke GitHub Pages.
#
# Sengaja terpisah dari trading-bot.yml:
#   - trading-bot.yml jalan tiap 5 menit dan hanya mengurus state.json.
#   - workflow ini hanya jalan kalau kode dashboard berubah (paths filter), jadi
#     commit state.json dari bot TIDAK memicu build ulang. Data tetap segar karena
#     dashboard membaca state.json langsung dari raw.githubusercontent.com saat runtime.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write      # publish ke Pages
  id-token: write   # verifikasi identitas deploy ke Pages

# Satu deploy Pages pada satu waktu; deploy yang sedang berjalan tidak dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm dibaca dari field "packageManager" di dashboard/package.json,
      # jadi versi lokal dan CI selalu sama.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      # --frozen-lockfile: gagal kalau pnpm-lock.yaml tidak sinkron dengan
      # package.json, supaya build CI reproducible.
      - run: pnpm install --frozen-lockfile

      # URL state.json di-inject saat build -> dashboard langsung menunjuk ke repo
      # ini tanpa setting manual USER/REPO di browser.
      - run: pnpm build
        env:
          VITE_STATE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/state.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
